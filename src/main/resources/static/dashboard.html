<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Privacy Shield - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card dashboard-container">

        <h1>Privacy Shield</h1>

        <p class="subtitle">
            Secure your private workspace
        </p>

        <h2>Dashboard</h2>

        <p class="dashboard-text">
            Welcome, <strong id="welcomeMessage"></strong>
        </p>


        <!-- SESSION STATUS -->

        <div class="dashboard-card">

            <h3>Secure Session</h3>

            <p id="sessionStatus">
                Checking session...
            </p>

            <div id="sessionIdDisplay" class="hidden">

                <p>
                    Session ID:
                    <strong id="sessionId"></strong>
                </p>

            </div>

            <button
                id="startSessionButton"
                onclick="createWorkspace()">

                Start Secure Session

            </button>

            <button
                id="endSessionButton"
                class="hidden"
                onclick="endSecureSession()">

                End Secure Session

            </button>

        </div>


        <!-- WORKSPACE -->

        <div
            id="workspaceCard"
            class="dashboard-card hidden">

            <h3>Secure Workspace</h3>

            <p>
                Your private workspace is ready.
            </p>

            <button onclick="openWorkspace()">

                Open Secure Workspace

            </button>

        </div>


        <!-- SESSION HISTORY -->

        <div class="dashboard-card">

            <h3>Session History</h3>

            <button onclick="viewSessions()">

                View Session History

            </button>

            <div
                id="sessionHistory"
                class="hidden">

            </div>

        </div>


        <!-- PASSWORD RESET -->

        <div class="dashboard-card">

            <h3>Account Security</h3>

            <button onclick="showResetPassword()">

                Reset Password

            </button>


            <div
                id="resetPasswordSection"
                class="hidden">

                <br>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                >

                <button onclick="resetPassword()">

                    Change Password

                </button>

                <p id="resetMessage"></p>

            </div>

        </div>


        <!-- LOGOUT -->

        <div class="dashboard-card">

            <button onclick="logoutUser()">

                Logout

            </button>

        </div>


        <p id="dashboardMessage"></p>

    </div>

</div>


<script src="js/app.js"></script>

</body>

</html>
